AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  # See https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
  # for more info to see how to tune the lambda function configs based on your use case.
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: java25
      Handler: com.chngy.jobscraper.App::handleRequest
      Timeout: 60
      MemorySize: 512
      CodeUri: ./target/job-scraper-lambda.jar
      Environment:
        Variables:
          CAREER_GOV_URL: https://jobs.careers.gov.sg/
          MY_CAREER_FUTURES_URL: https://www.mycareersfuture.gov.sg/
          SEARCH_TERM: software+engineer
          YEARS_OF_EXPERIENCE: oneToThree,fourToSix
          PROFILE: prod
      # Attach policies here to give the function permission to access other AWS resources if needed
      # See: https://github.com/awslabs/serverless-application-model/blob/master/docs/policy_templates.rst
      # eg:
      #Policies:
      # - S3ReadPolicy:
      #     BucketName: test-bucket